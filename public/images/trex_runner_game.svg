<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 558" width="1024" height="558">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243248"/>
      <stop offset="60%" stop-color="#141d31"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="groundGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC72C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFC72C" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="558" fill="url(#sky)"/>

  <!-- faint dot grid, matches the in-game canvas texture -->
  <g opacity="0.15">
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff"/>
    </pattern>
    <rect width="1024" height="558" fill="url(#dots)"/>
  </g>

  <!-- ground -->
  <rect x="0" y="430" width="1024" height="20" fill="url(#groundGlow)"/>
  <rect x="0" y="446" width="1024" height="112" fill="#0d1220"/>
  <line x1="0" y1="446" x2="1024" y2="446" stroke="#FFC72C" stroke-opacity="0.55" stroke-width="4"/>

  <!-- scrolling dashes for motion -->
  <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="6">
    <line x1="40" y1="472" x2="110" y2="472"/>
    <line x1="220" y1="472" x2="290" y2="472"/>
    <line x1="400" y1="472" x2="470" y2="472"/>
    <line x1="580" y1="472" x2="650" y2="472"/>
    <line x1="760" y1="472" x2="830" y2="472"/>
    <line x1="920" y1="472" x2="990" y2="472"/>
  </g>

  <!-- distant kitchen silhouettes -->
  <g fill="#1c2740" opacity="0.7">
    <rect x="70" y="330" width="70" height="116" rx="8"/>
    <rect x="860" y="300" width="90" height="146" rx="8"/>
    <circle cx="105" cy="316" r="22"/>
    <circle cx="905" cy="286" r="26"/>
  </g>

  <!-- obstacles, matching the in-canvas kitchen-hazard style -->
  <g>
    <rect x="700" y="378" width="60" height="68" rx="10" fill="#C23B15"/>
    <rect x="700" y="378" width="60" height="12" rx="6" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="800" y="396" width="96" height="50" rx="10" fill="#C23B15"/>
    <rect x="800" y="396" width="96" height="12" rx="6" fill="#ffffff" fill-opacity="0.18"/>
  </g>

  <!-- floating burger collectible -->
  <g transform="translate(560,300)">
    <ellipse cx="0" cy="46" rx="30" ry="30" fill="#FFC72C" opacity="0.12"/>
    <path d="M -30 -6 Q -30 -28 0 -28 Q 30 -28 30 -6 Z" fill="#E8A84F"/>
    <rect x="-28" y="-8" width="56" height="12" fill="#6B3A1F"/>
    <rect x="-29" y="4" width="58" height="16" rx="9" fill="#C97A34"/>
    <circle cx="-12" cy="-17" r="3" fill="#FFE9C4"/>
    <circle cx="6" cy="-20" r="3" fill="#FFE9C4"/>
    <circle cx="18" cy="-13" r="3" fill="#FFE9C4"/>
  </g>

  <!-- T-Rex, mid-jump -->
  <g transform="translate(300,300)">
    <ellipse cx="70" cy="185" rx="60" ry="14" fill="#000000" opacity="0.35"/>
    <image href="/images/Trex.png" x="-40" y="-40" width="220" height="148"/>
  </g>

  <rect width="1024" height="558" fill="url(#vignette)"/>
</svg>
